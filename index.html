<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <title>SalonLove | POS & Management</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
  <div class="desktop-app-frame flex flex-col min-h-screen">
    <header class="desktop-titlebar flex items-center justify-between px-4 py-2 border-b border-slate-200 bg-white/90 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="window-controls flex gap-2">
          <span class="window-btn close"></span>
          <span class="window-btn minimize"></span>
          <span class="window-btn maximize"></span>
        </div>
        <div class="h-4 w-[1px] bg-slate-300"></div>
        <div class="flex items-center gap-2 font-bold text-amber-600 text-sm">
          <i data-lucide="scissors" class="w-4 h-4"></i>
          <span>SalonLove POS</span>
        </div>
        <div class="h-4 w-[1px] bg-slate-300"></div>
        
        <!-- Restricted Branch Switcher -->
        <div class="flex items-center gap-1.5 cursor-pointer" id="branch-switch-wrapper">
          <i id="branch-pin-icon" data-lucide="lock" class="w-3.5 h-3.5 text-slate-400"></i>
          <select id="branch-selector" onchange="handleBranchChangeAttempt(this.value)" class="bg-slate-100 border border-slate-300 text-slate-500 text-xs font-bold rounded-lg px-2 py-1 focus:outline-none cursor-not-allowed" disabled>
            <option value="br-1">📍 فرع حمص</option>
            <option value="br-2">📍 فرع الوادي </option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-4 text-xs text-slate-600">
        <span id="system-mode-badge" class="px-2 py-0.5 rounded-full text-[10px] bg-emerald-100 text-emerald-700 border border-emerald-300">
          <i data-lucide="wifi" class="inline-block w-3 h-3 ml-1"></i> Desktop POS
        </span>
        <div id="live-clock" class="font-mono text-amber-600 font-bold">--:--:--</div>
        <button id="toggle-admin-lock-btn" class="flex items-center gap-1 text-slate-700 hover:text-amber-600 bg-slate-100 px-2 py-1 rounded border border-slate-300">
          <i id="admin-lock-icon" data-lucide="lock" class="w-3.5 h-3.5"></i>
          <span id="admin-lock-label">وضع المدير</span>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
      <aside class="w-60 bg-white border-l border-slate-200 flex flex-col justify-between p-3 select-none">
        <div class="space-y-4">
          <div class="flex items-center gap-3 px-3 py-2 bg-amber-50 rounded-xl border border-amber-200">
            <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center text-amber-600">
              <i data-lucide="heart" class="w-4 h-4"></i>
            </div>
            <div>
              <h1 class="font-bold text-sm text-slate-900">SalonLove</h1>
              <p class="text-[10px] text-amber-700 font-medium" id="current-branch-label">فرع الشعلان</p>
            </div>
          </div>
          <nav class="space-y-1" id="main-nav">
            <button data-view="dashboard" class="nav-item active flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>الرئيسية</span>
            </button>
            <button data-view="appointments" class="nav-item flex items-center justify-between w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <div class="flex items-center gap-3"><i data-lucide="calendar" class="w-4 h-4"></i><span>المواعيد</span></div>
              <span id="nav-badge-appointments" class="px-2 py-0.5 text-[10px] bg-amber-100 text-amber-700 rounded-full font-bold">0</span>
            </button>
            <button data-view="pos" class="nav-item flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="shopping-bag" class="w-4 h-4"></i><span>الكاشير (POS)</span>
            </button>
            <button data-view="receipts" class="nav-item flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="receipt" class="w-4 h-4"></i><span>الإيصالات</span>
            </button>
            <button data-view="bills" class="nav-item flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="file-text" class="w-4 h-4"></i><span>المصاريف</span>
            </button>
            <button data-view="inventory" class="nav-item flex items-center justify-between w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <div class="flex items-center gap-3"><i data-lucide="package" class="w-4 h-4"></i><span>المخزون</span></div>
              <span id="nav-badge-inventory" class="px-2 py-0.5 text-[10px] bg-rose-100 text-rose-700 rounded-full font-bold hidden">!</span>
            </button>
            <div class="pt-2 border-t border-slate-200 mt-2">
              <p class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">الإدارة</p>
              <button data-view="employees" class="nav-item admin-only flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
                <i data-lucide="users" class="w-4 h-4"></i><span>الموظفون والرواتب</span>
              </button>
              <button data-view="reports" class="nav-item admin-only flex items-center gap-3 w-full px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>التقارير والأرباح</span>
              </button>
            </div>
          </nav>
        </div>
        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2 text-xs">
          <div class="flex justify-between text-slate-600"><span>العملة:</span><span class="font-bold text-amber-600">SYP (ل.س)</span></div>
          <button id="quick-backup-btn" class="w-full py-1 bg-white hover:bg-slate-100 text-slate-700 text-[11px] rounded flex items-center justify-center gap-1 border border-slate-300 shadow-sm">
            <i data-lucide="download" class="w-3 h-3"></i><span>تصدير نسخة</span>
          </button>
        </div>
      </aside>
      <main class="flex-1 overflow-y-auto bg-slate-50 p-6 relative" id="app-main-content"></main>
    </div>
  </div>
  <div id="modals-placeholder"></div>
  <script src="app.js"></script>
</body>
</html>
