<!DOCTYPE html>
<html lang="ar" dir="rtl" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SalonLove | POS & Management</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d97706">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen">
  <!-- Mobile Backdrop Overlay -->
  <div id="mobile-sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden md:hidden transition-opacity"></div>

  <div class="desktop-app-frame flex flex-col min-h-screen">
    <!-- Top Bar -->
    <header class="desktop-titlebar flex items-center justify-between px-2.5 md:px-4 py-2 border-b border-slate-200 bg-white shadow-sm sticky top-0 z-30">
      <div class="flex items-center gap-1.5 md:gap-3 shrink-0">
        <!-- Mobile Menu Trigger -->
        <button id="mobile-menu-btn" type="button" onclick="toggleMobileSidebar(true)" class="md:hidden p-1.5 rounded-lg text-slate-700 hover:bg-slate-100 focus:outline-none">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>

        <!-- Desktop Controls -->
        <div class="window-controls hidden md:flex items-center gap-2">
          <span class="window-btn close"></span>
          <span class="window-btn minimize"></span>
          <span class="window-btn maximize"></span>
        </div>
        <div class="h-4 w-[1px] bg-slate-300 hidden md:block"></div>
        
        <div class="flex items-center gap-1 font-bold text-amber-600 text-xs md:text-sm">
          <i data-lucide="scissors" class="w-4 h-4"></i>
          <span class="hidden xs:inline">SalonLove</span>
        </div>
        <div class="h-4 w-[1px] bg-slate-200"></div>
        
        <!-- Restricted Branch Switcher -->
        <div class="flex items-center gap-1 cursor-pointer" id="branch-switch-wrapper">
          <i id="branch-pin-icon" data-lucide="lock" class="w-3.5 h-3.5 text-slate-400"></i>
          <select id="branch-selector" onchange="handleBranchChangeAttempt(this.value)" class="bg-slate-100 border border-slate-300 text-slate-600 text-[11px] md:text-xs font-bold rounded-lg px-1.5 py-1 focus:outline-none cursor-not-allowed max-w-[105px] sm:max-w-none truncate" disabled>
            <option value="br-1">📍 فرع حمص</option>
            <option value="br-2">📍 فرع الوادي</option>
          </select>
        </div>
      </div>

      <div class="flex items-center gap-1.5 md:gap-3 shrink-0">
        <!-- Global View Currency Toggle -->
        <div class="flex items-center bg-slate-100 p-0.5 rounded-lg border border-slate-300">
          <button type="button" id="curr-btn-syp" onclick="changeGlobalCurrency('SYP')" class="px-2 py-0.5 rounded text-[11px] font-bold transition bg-amber-500 text-white shadow-sm">ل.س</button>
          <button type="button" id="curr-btn-usd" onclick="changeGlobalCurrency('USD')" class="px-2 py-0.5 rounded text-[11px] font-bold text-slate-600 hover:text-amber-600 transition">$</button>
        </div>

        <div id="live-clock" class="font-mono text-amber-600 font-bold hidden sm:block text-xs">--:--:--</div>
        
        <!-- Admin Lock Button -->
        <button id="toggle-admin-lock-btn" type="button" class="flex items-center gap-1 text-slate-700 hover:text-amber-600 bg-slate-100 px-2 py-1 rounded-lg border border-slate-300 text-[11px] md:text-xs font-semibold whitespace-nowrap">
          <i id="admin-lock-icon" data-lucide="lock" class="w-3.5 h-3.5 text-amber-600"></i>
          <span id="admin-lock-label" class="hidden sm:inline">وضع المدير</span>
        </button>
      </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">
      <!-- Sidebar / Mobile Drawer -->
      <aside id="app-sidebar" class="w-64 bg-white border-l border-slate-200 flex flex-col justify-between p-3 select-none md:static md:w-60">
        <div class="space-y-4">
          <!-- Drawer Header with Functional Close Button -->
          <div class="flex items-center justify-between px-3 py-2 bg-amber-50 rounded-xl border border-amber-200">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg bg-amber-500/20 flex items-center justify-center text-amber-600">
                <i data-lucide="heart" class="w-4 h-4"></i>
              </div>
              <div>
                <h1 class="font-bold text-sm text-slate-900">SalonLove</h1>
                <p class="text-[10px] text-amber-700 font-medium" id="current-branch-label">فرع حمص</p>
              </div>
            </div>
            <button type="button" id="close-drawer-btn" onclick="toggleMobileSidebar(false)" class="md:hidden text-slate-500 hover:text-rose-600 p-1.5 rounded-lg bg-white border border-slate-200 shadow-sm active:scale-95 transition">
              <i data-lucide="x" class="w-5 h-5"></i>
            </button>
          </div>

          <nav class="space-y-1" id="main-nav">
            <button data-view="dashboard" class="nav-item active flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="layout-dashboard" class="w-4 h-4"></i><span>الرئيسية</span>
            </button>
            <button data-view="appointments" class="nav-item flex items-center justify-between w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <div class="flex items-center gap-3"><i data-lucide="calendar" class="w-4 h-4"></i><span>المواعيد</span></div>
              <span id="nav-badge-appointments" class="px-2 py-0.5 text-[10px] bg-amber-100 text-amber-700 rounded-full font-bold">0</span>
            </button>
            <button data-view="pos" class="nav-item flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="shopping-bag" class="w-4 h-4"></i><span>الكاشير (POS)</span>
            </button>
            <button data-view="receipts" class="nav-item flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="receipt" class="w-4 h-4"></i><span>الإيصالات</span>
            </button>
            <button data-view="bills" class="nav-item flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <i data-lucide="file-text" class="w-4 h-4"></i><span>المصاريف</span>
            </button>
            <button data-view="inventory" class="nav-item flex items-center justify-between w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
              <div class="flex items-center gap-3"><i data-lucide="package" class="w-4 h-4"></i><span>المخزون</span></div>
              <span id="nav-badge-inventory" class="px-2 py-0.5 text-[10px] bg-rose-100 text-rose-700 rounded-full font-bold hidden">!</span>
            </button>
            <div class="pt-2 border-t border-slate-200 mt-2">
              <p class="px-3 text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">الإدارة</p>
              <button data-view="employees" class="nav-item admin-only flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
                <i data-lucide="users" class="w-4 h-4"></i><span>الموظفون والرواتب</span>
              </button>
              <button data-view="reports" class="nav-item admin-only flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-xs font-semibold text-slate-700 hover:bg-slate-100 hover:text-amber-600">
                <i data-lucide="bar-chart-3" class="w-4 h-4"></i><span>التقارير والأرباح</span>
              </button>
            </div>
          </nav>
        </div>

        <div class="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-2 text-xs">
          <div class="flex justify-between items-center text-slate-600">
            <span>عملة العرض:</span>
            <span id="sidebar-curr-label" class="font-bold text-amber-600">ل.س (SYP)</span>
          </div>
          <button id="quick-backup-btn" type="button" class="w-full py-1.5 bg-white hover:bg-slate-100 text-slate-700 text-[11px] rounded-lg flex items-center justify-center gap-1 border border-slate-300 shadow-sm font-semibold">
            <i data-lucide="download" class="w-3.5 h-3.5"></i><span>تصدير نسخة احتياطية</span>
          </button>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 overflow-y-auto bg-slate-50 p-3 md:p-6 pb-24 md:pb-6 relative" id="app-main-content"></main>
    </div>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-3 py-1 flex justify-around items-center z-30 shadow-lg">
      <button type="button" onclick="switchView('dashboard')" class="flex flex-col items-center py-1 text-slate-600 hover:text-amber-600 focus:outline-none">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">الرئيسية</span>
      </button>
      <button type="button" onclick="switchView('appointments')" class="flex flex-col items-center py-1 text-slate-600 hover:text-amber-600 focus:outline-none">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">المواعيد</span>
      </button>
      <button type="button" onclick="switchView('pos')" class="flex flex-col items-center py-1 text-amber-600 focus:outline-none">
        <div class="w-9 h-9 rounded-full bg-amber-500 text-white flex items-center justify-center -mt-4 shadow-md">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        </div>
        <span class="text-[10px] mt-0.5 font-bold">الكاشير</span>
      </button>
      <button type="button" onclick="switchView('bills')" class="flex flex-col items-center py-1 text-slate-600 hover:text-amber-600 focus:outline-none">
        <i data-lucide="file-text" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">المصاريف</span>
      </button>
      <button type="button" onclick="toggleMobileSidebar(true)" class="flex flex-col items-center py-1 text-slate-600 hover:text-amber-600 focus:outline-none">
        <i data-lucide="menu" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">المزيد</span>
      </button>
    </nav>
  </div>

  <div id="modals-placeholder"></div>
  <script src="app.js"></script>
</body>
</html>
